[package]
name = "bolte-pari"
version = "1.0.0"
description = "Bolte Pari - Offline English A1 to C2 learning app"
authors = ["masudinfosec"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
