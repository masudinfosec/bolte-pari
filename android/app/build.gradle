plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
// Signing secrets are kept OUT of the repo in keystore.properties (gitignored).
def ksProps = new Properties()
def ksFile = rootProject.file("keystore.properties")
if (ksFile.exists()) { ksProps.load(new FileInputStream(ksFile)) }
android {
    namespace 'com.masud.boltepari'
    compileSdk 35
    buildToolsVersion "35.0.0"
    defaultConfig {
        applicationId "com.masud.boltepari"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.0"
    }
    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (ksFile.exists()) { signingConfig signingConfigs.release }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}
dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'com.google.android.gms:play-services-ads:23.6.0'
}
